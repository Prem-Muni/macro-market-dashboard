name: Refresh EOD dashboard

on:
  schedule:
    # Primary at 3:20pm CT (4:20pm ET) after verified regular market close.
    - cron: '20 15 * * 1-5'
      timezone: 'America/Chicago'
    # Backup at 4:20pm CT when unofficial providers have published more bars.
    - cron: '20 16 * * 1-5'
      timezone: 'America/Chicago'
    # Late backup at 7:20pm CT for delayed vendors; same-day archives upsert.
    - cron: '20 19 * * 1-5'
      timezone: 'America/Chicago'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: market-refresh
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Generate latest EOD data
        env:
          SUPPLEMENTAL_DATA_URL: ${{ secrets.SUPPLEMENTAL_DATA_URL }}
        run: python scripts/update.py
      - name: Save snapshot to GitHub history (non-blocking if repository changes)
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/latest.json
          if git diff --cached --quiet; then
            echo "No new data"
          else
            git commit -m "Update market dashboard [skip ci]"
            if ! git push origin HEAD:main; then
              echo "Repository changed during refresh; attempting a safe rebase, never a force push."
              git fetch origin main
              if git rebase origin/main && git push origin HEAD:main; then
                echo "Saved market snapshot after synchronizing"
              else
                git rebase --abort 2>/dev/null || true
                echo "::warning::Could not save JSON to Git history. Pages will still deploy this run's generated snapshot; investigate any remote changes."
              fi
            fi
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs
  deploy:
    name: Deploy published dashboard
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    timeout-minutes: 10
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
