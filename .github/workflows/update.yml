name: Refresh EOD dashboard

on:
  schedule:
    # UTC probes cover both CST and CDT. Python gate uses the NYSE calendar.
    - cron: '20,50 17,18 * 7,11,12 1-5'
    - cron: '20 20,21,22 * * 1-5'
    - cron: '20 0,1 * * 2-6'
  workflow_dispatch:
    inputs:
      backup_phase:
        description: 'Manual deploy, or an independently scheduled eligibility-checked backup'
        type: choice
        options: [manual, early, regular, late]
        default: manual

permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: market-refresh
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      publish: ${{ steps.save_snapshot.outputs.deploy }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check scheduled session eligibility
        id: schedule_gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_CRON: ${{ github.event.schedule }}
          BACKUP_PHASE: ${{ inputs.backup_phase }}
        run: python scripts/schedule_gate.py
      - name: Generate latest EOD data
        if: steps.schedule_gate.outputs.publish == 'true'
        env:
          SUPPLEMENTAL_DATA_URL: ${{ secrets.SUPPLEMENTAL_DATA_URL }}
        run: python scripts/update.py
      - name: Save snapshot to GitHub history (fail closed on conflict)
        id: save_snapshot
        if: steps.schedule_gate.outputs.publish == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/latest.json
          if git diff --cached --quiet; then
            echo "No new data"
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.backup_phase }}" = "manual" ]; then echo "deploy=true" >> "$GITHUB_OUTPUT"; else echo "deploy=false" >> "$GITHUB_OUTPUT"; fi
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            git commit -m "Update market dashboard [skip ci]"
            if ! git push origin HEAD:main; then
              echo "Repository changed during refresh; attempting a safe rebase, never a force push."
              git fetch origin main
              if git rebase origin/main && git push origin HEAD:main; then
                echo "Saved market snapshot after synchronizing"
              else
                git rebase --abort 2>/dev/null || true
                echo "::error::Could not safely save JSON to Git history; refusing to deploy a divergent snapshot."
                exit 1
              fi
            fi
          fi
      - name: Verify publication is synchronized with main
        if: steps.save_snapshot.outputs.deploy == 'true'
        shell: bash
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "::error::Repository changed during publication; retry from current main."
            exit 1
          fi
      - name: Configure GitHub Pages
        if: steps.save_snapshot.outputs.deploy == 'true'
        uses: actions/configure-pages@v6
      - name: Upload website artifact
        if: steps.save_snapshot.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs
  deploy:
    name: Deploy published dashboard
    needs: update
    if: needs.update.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    timeout-minutes: 10
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
