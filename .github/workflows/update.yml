name: Refresh EOD dashboard

on:
  schedule:
    # Primary: 3:15pm Central, 15 minutes after the regular US equity close.
    - cron: '15 15 * * 1-5'
      timezone: 'America/Chicago'
    # Backup: 4:15pm Central, if a provider has not finalized daily bars at 3:15.
    # Re-running the updater updates today's existing archive record, never duplicates it.
    - cron: '15 16 * * 1-5'
      timezone: 'America/Chicago'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: market-refresh
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Generate latest EOD data
        env:
          SUPPLEMENTAL_DATA_URL: ${{ secrets.SUPPLEMENTAL_DATA_URL }}
        run: python scripts/update.py
      - name: Save snapshot to GitHub history (non-blocking if repository changes)
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/latest.json
          if git diff --cached --quiet; then
            echo "No new data"
          else
            git commit -m "Update market dashboard [skip ci]"
            if ! git push origin HEAD:main; then
              echo "Repository changed during refresh; attempting a safe rebase, never a force push."
              git fetch origin main
              if git rebase origin/main && git push origin HEAD:main; then
                echo "Saved market snapshot after synchronizing"
              else
                git rebase --abort 2>/dev/null || true
                echo "::warning::Could not save JSON to Git history. Pages will still deploy this run's generated snapshot; investigate any remote changes."
              fi
            fi
          fi
      # GITHUB_TOKEN-created commits do not reliably trigger branch-based Pages builds.
      # Publish the generated docs/ directory directly in this workflow instead.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  # Separate job prevents the GitHub Pages artifact lookup from racing its upload.
  deploy:
    name: Deploy published dashboard
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    timeout-minutes: 10
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
