name: Validate dashboard changes
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt 'pytest>=8,<10'
      - name: Focused offline EOD and source regression tests
        run: |
          python -m pytest -q tests/test_vxn_targeted_repair.py tests/test_reliability_retry.py tests/test_price_risk.py tests/test_eod_freshness_guard.py tests/test_early_close_source_audit.py tests/test_eod_snapshot_integrity.py tests/test_snapshot_quality.py tests/test_insights_history.py
      - name: JavaScript syntax
        run: |
          node --check docs/app.js
          node --check docs/market-insights-extra.js
          node --check docs/overview-unified.js
          node --check docs/dashboard-clarity.js
          node --check docs/daily-summaries.js
          node --test tests/test_overview_signal_board.cjs tests/test_market_history_accordion.cjs

