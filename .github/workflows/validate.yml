name: Validate dashboard changes
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Focused offline EOD and source regression tests
        run: |
          python -m unittest discover -s tests -p 'test_eod_freshness_guard.py'
          python -m unittest discover -s tests -p 'test_early_close_source_audit.py'
          python -m unittest discover -s tests -p 'test_eod_snapshot_integrity.py'
          python -m unittest discover -s tests -p 'test_snapshot_quality.py'
          python -m unittest discover -s tests -p 'test_insights_history.py'
      - name: JavaScript syntax
        run: |
          node --check docs/app.js
          node --check docs/market-insights-extra.js
